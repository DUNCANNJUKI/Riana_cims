stages:
  - audit
  - sast
  - test
  - build
  - deploy

variables:
  NODE_VERSION: "22"
  SAST_EXCLUDED_PATHS: "spec, test, tests, tmp, node_modules, dist"
  SECRET_DETECTION_EXCLUDED_PATHS: "node_modules, dist"

dependency_audit:
  stage: audit
  image: node:22
  script:
    - echo "=== SCA - Checking for known CVEs in dependencies ==="
    - npm ci
    - npm audit --omit=dev --audit-level=high
    - echo "=== SCA - Checking for outdated packages ==="
    - npm outdated || true
  allow_failure: false
  only:
    - branches
  artifacts:
    when: always
    paths:
      - npm-audit.json
    expire_in: 30 days
  after_script:
    - npm audit --json > npm-audit.json 2>/dev/null || true

license_check:
  stage: audit
  image: node:22
  script:
    - echo "=== License Compliance - Checking dependency licenses ==="
    - npm ci
    - npx --yes license-checker --onlyAllow "MIT;ISC;BSD-2-Clause;BSD-3-Clause;Apache-2.0;CC0-1.0;CC-BY-3.0;CC-BY-4.0;Unlicense;Python-2.0;0BSD" --excludePrivatePackages
  allow_failure: true
  only:
    - branches

include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

build:
  stage: build
  image: node:22
  script:
    - echo "=== Build - Installing dependencies ==="
    - npm ci
    - npm ci --prefix CRMS
    - echo "=== Build - Running communication regression suite ==="
    - npm run test:communication
    - echo "=== Build - Building CIMS and Developers production frontends ==="
    - npm run build:all
    - echo "=== Build - Verifying dist output ==="
    - ls -la dist/
  artifacts:
    paths:
      - dist/
      - server/
      - CRMS/
      - package.json
      - package-lock.json
      - ecosystem.config.cjs
      - setup_db.cjs
    expire_in: 1 hour
  only:
    - branches

deploy:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client rsync
    - eval $(ssh-agent -s)
    - echo "$CX_SERVER_SSH_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo "$CX_SERVER_HOST_KEY" >> ~/.ssh/known_hosts
    - chmod 600 ~/.ssh/known_hosts
  script:
    - echo "=== Deploy - Syncing files to deployment target ==="
    - |
      rsync -avz -e "ssh -p 1625" --delete \
        --exclude='.env.local' \
        --exclude='node_modules' \
        --exclude='server/backups' \
        --exclude='server/uploads' \
        --exclude='src' \
        --exclude='.git' \
        --exclude='*.ts' \
        --exclude='vite.config.*' \
        --exclude='vitest.config.*' \
        ./ \
        $CX_SERVER_USER@$CX_SERVER_HOST:/var/www/riana-cims/cms/
    - echo "=== Deploy - Installing production deps and restarting app ==="
    - |
      ssh -tt -p 1625 $CX_SERVER_USER@$CX_SERVER_HOST << 'EOF'
        cd /var/www/riana-cims/cms
        echo "=== Deploy - Installing API production dependencies ==="
        npm --prefix server ci --omit=dev
        echo "=== Deploy - Creating and verifying a database backup ==="
        mkdir -p server/backups
        chmod 700 server/backups
        node server/scripts/verify-backup.cjs
        find server/backups -maxdepth 1 -type f -name '*.sql' -exec chmod 600 {} +
        echo "=== Deploy - Applying missing communication migrations ==="
        COMMUNICATION_MIGRATION_BACKUP_VERIFIED=true node server/scripts/apply-communication-migrations.cjs
        echo "=== Deploy - Restarting the API ==="
        sudo env APP_RELEASE="$APP_RELEASE" /root/.nvm/versions/node/v23.6.0/bin/pm2 restart ecosystem.config.cjs --only riana-cims --env production --update-env || sudo env APP_RELEASE="$APP_RELEASE" /root/.nvm/versions/node/v23.6.0/bin/pm2 restart riana-cims --update-env || sudo env APP_RELEASE="$APP_RELEASE" /root/.nvm/versions/node/v23.6.0/bin/pm2 start ecosystem.config.cjs --only riana-cims --env production
        sudo /root/.nvm/versions/node/v23.6.0/bin/pm2 save
        echo "=== Ensuring Nginx CSP allows WebAssembly ==="
        sudo sed -i "s/script-src 'self';/script-src 'self' 'wasm-unsafe-eval' 'unsafe-eval';/g" /etc/nginx/sites-available/* /etc/nginx/sites-enabled/* /etc/nginx/conf.d/* 2>/dev/null || true
        sudo sed -i "s/script-src 'self' /script-src 'self' 'wasm-unsafe-eval' 'unsafe-eval' /g" /etc/nginx/sites-available/* /etc/nginx/sites-enabled/* /etc/nginx/conf.d/* 2>/dev/null || true
        sudo nginx -t && (sudo systemctl reload nginx || sudo service nginx reload) || true
        echo "=== Verifying host localhost:8081 CSP header ==="
        curl -s -I http://127.0.0.1:8081 | grep -i "Content-Security-Policy" || true
        # echo "=== Deploy - Verifying API health ==="
        # node server/scripts/verify-production-runtime.cjs
        echo "=== Deploy complete ==="
        sudo /root/.nvm/versions/node/v23.6.0/bin/pm2 list
      EOF
  only:
    - main
  environment:
    name: production
    url: https://rianacims.marezi.co
  when: on_success