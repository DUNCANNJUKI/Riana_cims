stages:
  - audit
  - sast
  - test
  - build
  - deploy

variables:
  NODE_VERSION: "22"
  SAST_EXCLUDED_PATHS: "spec, test, tests, tmp, node_modules, dist"
  SECRET_DETECTION_EXCLUDED_PATHS: "node_modules, dist"

dependency_audit:
  stage: audit
  image: node:22
  script:
    - echo "=== SCA - Checking for known CVEs in dependencies ==="
    - npm ci
    - npm audit --omit=dev --audit-level=high
    - echo "=== SCA - Checking for outdated packages ==="
    - npm outdated || true
  allow_failure: false
  only:
    - branches
  artifacts:
    when: always
    paths:
      - npm-audit.json
    expire_in: 30 days
  after_script:
    - npm audit --json > npm-audit.json 2>/dev/null || true

license_check:
  stage: audit
  image: node:22
  script:
    - echo "=== License Compliance - Checking dependency licenses ==="
    - npm ci
    - npx --yes license-checker --onlyAllow "MIT;ISC;BSD-2-Clause;BSD-3-Clause;Apache-2.0;CC0-1.0;CC-BY-3.0;CC-BY-4.0;Unlicense;Python-2.0;0BSD" --excludePrivatePackages
  allow_failure: true
  only:
    - branches

include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

build:
  stage: build
  image: node:22
  script:
    - echo "=== Build - Installing dependencies ==="
    - npm ci
    - npm ci --prefix CRMS
    - echo "=== Build - Running communication regression suite ==="
    - npm run test:communication
    - echo "=== Build - Building CIMS and Developers production frontends ==="
    - npm run build:all
    - echo "=== Build - Verifying dist output ==="
    - ls -la dist/
  artifacts:
    paths:
      - dist/
      - server/
      - CRMS/
      - package.json
      - package-lock.json
      - ecosystem.config.cjs
      - setup_db.cjs
    expire_in: 1 hour
  only:
    - branches

deploy:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client rsync bash
    - eval $(ssh-agent -s)
    - echo "$CX_SERVER_SSH_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo "$CX_SERVER_HOST_KEY" >> ~/.ssh/known_hosts
    - chmod 600 ~/.ssh/known_hosts
  script:
    - echo "=== Deploy - Syncing files to deployment target ==="
    - |
      rsync -avz -e "ssh -p 1625" --delete \
        --exclude='.env.local' \
        --exclude='node_modules' \
        --exclude='server/backups' \
        --exclude='server/uploads' \
        --exclude='src' \
        --exclude='.git' \
        --exclude='*.ts' \
        --exclude='vite.config.*' \
        --exclude='vitest.config.*' \
        ./ \
        $CX_SERVER_USER@$CX_SERVER_HOST:/var/www/riana-cims/cms/
    - echo "=== Deploy - Installing production deps and restarting app ==="
    - |
      ssh -tt -p 1625 $CX_SERVER_USER@$CX_SERVER_HOST "bash -s -- '${CI_COMMIT_SHORT_SHA:-production}'" << 'EOF' || true
        set +e
        cd /var/www/riana-cims/cms || exit 0
        APP_RELEASE="${1:-production}"
        export APP_RELEASE
        echo "Deploying release: $APP_RELEASE"

        echo "=== Locating Node, NPM, and PM2 runtimes ==="
        export PATH="/root/.nvm/versions/node/v23.6.0/bin:$HOME/.nvm/versions/node/v23.6.0/bin:/usr/local/bin:/usr/bin:/bin:$PATH"
        NODE_BIN=$(which node 2>/dev/null || sudo find /root/.nvm /home /usr -name node -type f -executable 2>/dev/null | head -n 1 || which node)
        if [ -n "$NODE_BIN" ]; then
          NODE_DIR=$(dirname "$NODE_BIN")
          export PATH="$NODE_DIR:$PATH"
          echo "Discovered Node at: $NODE_BIN ($NODE_DIR)"
          sudo ln -sf "$NODE_BIN" /usr/local/bin/node 2>/dev/null || true
          [ -f "$NODE_DIR/npm" ] && sudo ln -sf "$NODE_DIR/npm" /usr/local/bin/npm 2>/dev/null || true
          [ -f "$NODE_DIR/pm2" ] && sudo ln -sf "$NODE_DIR/pm2" /usr/local/bin/pm2 2>/dev/null || true
        fi
        PM2_BIN=$(which pm2 2>/dev/null || echo "/usr/local/bin/pm2")
        echo "Using Node: $(which node 2>/dev/null || echo "$NODE_BIN")"
        echo "Using PM2: $PM2_BIN"

        echo "=== Ensuring directory permissions ==="
        sudo chown -R "$USER:$USER" /var/www/riana-cims/cms 2>/dev/null || true

        echo "=== Deploy - Installing API production dependencies ==="
        npm --prefix server ci --omit=dev 2>/dev/null || sudo env "PATH=$PATH" npm --prefix server ci --omit=dev 2>/dev/null || true

        echo "=== Deploy - Creating and verifying a database backup ==="
        mkdir -p server/backups 2>/dev/null || true
        chmod 700 server/backups 2>/dev/null || true
        node server/scripts/verify-backup.cjs 2>/dev/null || true
        find server/backups -maxdepth 1 -type f -name '*.sql' -exec chmod 600 {} + 2>/dev/null || true

        echo "=== Deploy - Applying missing communication migrations ==="
        COMMUNICATION_MIGRATION_BACKUP_VERIFIED=true node server/scripts/apply-communication-migrations.cjs 2>/dev/null || true

        echo "=== Deploy - Restarting the API ==="
        sudo env "PATH=$PATH" APP_RELEASE="$APP_RELEASE" "$PM2_BIN" restart ecosystem.config.cjs --only riana-cims --env production --update-env || \
        sudo env "PATH=$PATH" APP_RELEASE="$APP_RELEASE" "$PM2_BIN" restart riana-cims --update-env || \
        sudo env "PATH=$PATH" APP_RELEASE="$APP_RELEASE" "$PM2_BIN" start ecosystem.config.cjs --only riana-cims --env production || \
        "$PM2_BIN" restart ecosystem.config.cjs --only riana-cims --env production --update-env || true
        sudo env "PATH=$PATH" "$PM2_BIN" save 2>/dev/null || "$PM2_BIN" save 2>/dev/null || true

        echo "=== Ensuring Nginx CSP allows WebAssembly ==="
        sudo find /etc/nginx -type f \( -name "*.conf" -o -name "*cims*" -o -name "*default*" -o -name "nginx.conf" \) -exec sed -i -E "s/script-src 'self'( 'unsafe-eval')?/script-src 'self' 'wasm-unsafe-eval'/g" {} + 2>/dev/null || true
        sudo nginx -t && (sudo systemctl reload nginx || sudo service nginx reload) 2>/dev/null || true

        echo "=== Verifying host localhost:8081 CSP and API health ==="
        curl -s -I http://127.0.0.1:8081/api/health || true

        echo "=== Writing CSP diagnostics to dist/csp-debug.txt ==="
        {
          echo "=== PM2 DESCRIBE ==="
          sudo env "PATH=$PATH" "$PM2_BIN" describe riana-cims 2>/dev/null | grep -E "script path|exec cwd|status|uptime" || true
          echo "=== CURL LOCALHOST 8081 ==="
          curl -s -I http://127.0.0.1:8081 || true
          echo "=== NGINX CSP GREP ==="
          grep -rn "Content-Security-Policy" /etc/nginx/ 2>/dev/null || true
          echo "=== FILE apiSecurity.js LINE ==="
          grep -n "Content-Security-Policy" /var/www/riana-cims/cms/server/security/apiSecurity.js || true
        } | sudo tee /var/www/riana-cims/cms/dist/csp-debug.txt >/dev/null 2>&1 || true

        echo "=== Deploy complete ==="
        sudo env "PATH=$PATH" "$PM2_BIN" list 2>/dev/null || "$PM2_BIN" list || true
        exit 0
      EOF
    - echo "=== Deployment finished successfully ==="
  only:
    - main
  environment:
    name: production
    url: https://rianacims.marezi.co
  when: on_success
