stages:
  - audit
  - sast
  - test
  - build
  - deploy

variables:
  NODE_VERSION: "22"
  SAST_EXCLUDED_PATHS: "spec, test, tests, tmp, node_modules, dist"
  SECRET_DETECTION_EXCLUDED_PATHS: "node_modules, dist"

dependency_audit:
  stage: audit
  image: node:22
  script:
    - npm ci
    - npm ci --prefix server
    - npm ci --prefix CRMS
    - npm audit --audit-level=high
    - npm audit --prefix server --audit-level=high
    - npm audit --prefix CRMS --audit-level=high
  only:
    - branches

license_check:
  stage: audit
  image: node:22
  script:
    - npm ci
    - npx --yes license-checker --onlyAllow "MIT;ISC;BSD-2-Clause;BSD-3-Clause;Apache-2.0;CC0-1.0;CC-BY-3.0;CC-BY-4.0;Unlicense;Python-2.0;0BSD" --excludePrivatePackages
  allow_failure: true
  only:
    - branches

include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

build:
  stage: build
  image: node:22
  script:
    - npm ci
    - npm ci --prefix server
    - npm ci --prefix CRMS
    - npm run typecheck
    - npm run lint
    - npm run lint --prefix CRMS
    - npm test
    - npm run build:all
  artifacts:
    paths:
      - dist/
      - server/
      - CRMS/dist/
      - public/
      - package.json
      - package-lock.json
      - ecosystem.config.cjs
      - setup_db.cjs
    exclude:
      - server/node_modules/**/*
    expire_in: 7 days
  only:
    - branches

call_background_browser_qa:
  stage: test
  image: node:22
  script:
    - npm ci
    - npm ci --prefix server
    - npx playwright install --with-deps chromium
    - mkdir -p .runtime
    - RIANA_QA_ARTIFACTS=.runtime/background-qa npm run test:call-background:browser > .runtime/call-background-browser.log 2>&1
  after_script:
    - cat .runtime/call-background-browser.log || true
  artifacts:
    when: always
    paths:
      - .runtime/call-background-browser.log
      - .runtime/background-qa/
    expire_in: 7 days
  only:
    - branches

production_communication_check:
  stage: deploy
  image: node:22
  needs:
    - job: build
      artifacts: true
  script:
    - node server/scripts/verify-communication-runtime.cjs --origin https://rianacims.marezi.co --release "$CI_COMMIT_SHA"
  # Read-only diagnostic against the current release; it may precede deployment.
  allow_failure: true
  only:
    - main

deploy:
  stage: deploy
  image: alpine:latest
  resource_group: production
  dependencies:
    - build
  before_script:
    - apk add --no-cache openssh-client rsync bash curl nodejs
    - eval $(ssh-agent -s)
    - |
      set -eu
      test -n "$CX_SERVER_HOST_KEY"
      (printf '%s\n' "$CX_SERVER_SSH_KEY" | tr -d '\r') | ssh-add -
      mkdir -p ~/.ssh
      chmod 700 ~/.ssh
      printf '%s\n' "$CX_SERVER_HOST_KEY" > ~/.ssh/known_hosts
      chmod 600 ~/.ssh/known_hosts
  script:
    - |
      rsync -avz -e "ssh -p 1625 -o StrictHostKeyChecking=yes -o BatchMode=yes" --delete \
        --exclude='.env*' \
        --exclude='node_modules' \
        --exclude='.runtime' \
        --exclude='server/backups' \
        --exclude='server/uploads' \
        --exclude='server/private_uploads' \
        --exclude='server/tmp' \
        --exclude='src' \
        --exclude='.git' \
        --exclude='*.ts' \
        --exclude='vite.config.*' \
        --exclude='vitest.config.*' \
        ./ "$CX_SERVER_USER@$CX_SERVER_HOST:/var/www/riana-cims/cms/"
    - ssh -p 1625 -o StrictHostKeyChecking=yes -o BatchMode=yes "$CX_SERVER_USER@$CX_SERVER_HOST" "bash /var/www/riana-cims/cms/server/scripts/deploy-production.sh '$CI_COMMIT_SHA'"
    - |
      curl --fail --silent --show-error --max-time 20 https://rianacims.marezi.co/api/health > /tmp/riana-health.json
      grep -Eq '"status"[[:space:]]*:[[:space:]]*"ok"' /tmp/riana-health.json
      grep -Eq "\"release\"[[:space:]]*:[[:space:]]*\"$CI_COMMIT_SHA\"" /tmp/riana-health.json
    - node server/scripts/verify-communication-runtime.cjs --origin https://rianacims.marezi.co --release "$CI_COMMIT_SHA"
  only:
    - main
  environment:
    name: production
    url: https://rianacims.marezi.co
  allow_failure: false
