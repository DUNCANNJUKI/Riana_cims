stages:
  - audit
  - sast
  - test
  - build
  - deploy

variables:
  NODE_VERSION: "22"
  SAST_EXCLUDED_PATHS: "spec, test, tests, tmp, node_modules, dist"
  SECRET_DETECTION_EXCLUDED_PATHS: "node_modules, dist"

dependency_audit:
  stage: audit
  image: node:22
  script:
    - echo "=== SCA - Checking for known CVEs in dependencies ==="
    - npm ci
    - npm audit --omit=dev --audit-level=high
    - echo "=== SCA - Checking for outdated packages ==="
    - npm outdated || true
  allow_failure: true
  only:
    - branches
  artifacts:
    when: always
    paths:
      - npm-audit.json
    expire_in: 30 days
  after_script:
    - npm audit --json > npm-audit.json 2>/dev/null || true

license_check:
  stage: audit
  image: node:22
  script:
    - echo "=== License Compliance - Checking dependency licenses ==="
    - npm ci
    - npx --yes license-checker --onlyAllow "MIT;ISC;BSD-2-Clause;BSD-3-Clause;Apache-2.0;CC0-1.0;CC-BY-3.0;CC-BY-4.0;Unlicense;Python-2.0;0BSD" --excludePrivatePackages
  allow_failure: true
  only:
    - branches

include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

semgrep-sast:
  allow_failure: true

nodejs-scan-sast:
  allow_failure: true

secret_detection:
  allow_failure: true

build:
  stage: build
  image: node:22
  script:
    - echo "=== Build - Installing dependencies ==="
    - npm ci
    - npm ci --prefix CRMS
    - echo "=== Build - Running communication regression suite ==="
    - npm run test:communication
    - echo "=== Build - Building CIMS and Developers production frontends ==="
    - npm run build:all
    - echo "=== Build - Verifying dist output ==="
    - ls -la dist/
  artifacts:
    paths:
      - dist/
      - server/
      - CRMS/
      - public/
      - package.json
      - package-lock.json
      - ecosystem.config.cjs
      - setup_db.cjs
    expire_in: 1 hour
  only:
    - branches

deploy:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client rsync bash
    - eval $(ssh-agent -s)
    - (echo "$CX_SERVER_SSH_KEY" | tr -d '\r'; echo "") | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo -e "Host *\n\tStrictHostKeyChecking no\n\tUserKnownHostsFile /dev/null\n\tLogLevel ERROR\n" > ~/.ssh/config
    - chmod 600 ~/.ssh/config
    - echo "$CX_SERVER_HOST_KEY" >> ~/.ssh/known_hosts 2>/dev/null || true
    - chmod 600 ~/.ssh/known_hosts 2>/dev/null || true
  script:
    - echo "=== Deploy - Syncing files to deployment target ==="
    - |
      rsync -avz -e "ssh -p 1625 -o StrictHostKeyChecking=no" --delete \
        --exclude='.env*' \
        --exclude='node_modules' \
        --exclude='server/backups' \
        --exclude='server/uploads' \
        --exclude='src' \
        --exclude='.git' \
        --exclude='*.ts' \
        --exclude='vite.config.*' \
        --exclude='vitest.config.*' \
        ./ \
        $CX_SERVER_USER@$CX_SERVER_HOST:/var/www/riana-cims/cms/
    - echo "=== Deploy - Running remote deployment script ==="
    - |
      ssh -tt -p 1625 -o StrictHostKeyChecking=no $CX_SERVER_USER@$CX_SERVER_HOST \
        "bash /var/www/riana-cims/cms/server/scripts/deploy-production.sh '${CI_COMMIT_SHORT_SHA:-production}'; exit 0" || true
    - echo "=== Deployment finished successfully ==="
  only:
    - main
  environment:
    name: production
    url: https://rianacims.marezi.co
  when: on_success
